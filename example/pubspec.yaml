name: flutter_map_layer_labeler_example
description: "Interactive demo of the flutter_map_layer_labeler package."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.13.0

dependencies:
  flutter:
    sdk: flutter
  flutter_map: ^8.3.2
  flutter_map_layer_labeler:
    path: ../
  latlong2: ^0.9.0
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  # Natural Earth data, generated by tool/build_data.dart.
  assets:
    - assets/data/
